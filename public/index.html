<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Norish to AnyList Sync</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background-color: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
        }
    </style>
</head>
<body>
    <h1>Norish to AnyList Sync</h1>
    <p>Background sync is running based on the schedule, but you can also manually trigger a sync here.</p>

    <button id="syncButton">Force Sync Now</button>

    <div id="status"></div>

    <script>
        const syncButton = document.getElementById('syncButton');
        const statusDiv = document.getElementById('status');

        syncButton.addEventListener('click', async () => {
            syncButton.disabled = true;
            syncButton.textContent = 'Syncing...';

            statusDiv.className = 'info';
            statusDiv.textContent = 'Sync process started. Please wait...';
            statusDiv.style.display = 'block';

            try {
                const response = await fetch('/api/sync', {
                    method: 'POST'
                });
                const data = await response.json();

                if (response.ok) {
                    statusDiv.className = 'success';
                    statusDiv.innerHTML = `<strong>Success!</strong> ${data.message}`;
                } else {
                    statusDiv.className = 'error';
                    statusDiv.innerHTML = `<strong>Error!</strong> ${data.error || 'An unknown error occurred.'}`;
                }
            } catch (error) {
                statusDiv.className = 'error';
                statusDiv.innerHTML = `<strong>Error!</strong> Failed to connect to the server: ${error.message}`;
            } finally {
                syncButton.disabled = false;
                syncButton.textContent = 'Force Sync Now';
            }
        });
    </script>
</body>
</html>
